[package]
name = "wormhole-nym"
version = "0.1.5"
edition = "2021"
description = "P2P file transfer over the Nym mixnet — no relay server needed"
license = "GPL-3.0-only"

[[bin]]
name = "wormhole-nym"
path = "src/main.rs"

[dependencies]
wormhole-nym-core = { path = "../lib" }
nym-sdk = "1.20.4"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Crypto (receive.rs hashes chunks on the fly)
sha2 = "0.10"

# Error handling
anyhow = "1"

# Progress display
indicatif = "0.17"

# Logging (suppress noisy nym-sdk internals)
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
